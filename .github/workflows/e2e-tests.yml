name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show browser version
        run: |
          (google-chrome --version || chromium --version || chromium-browser --version)

      - name: Run E2E tests
        env:
          E2E_APP_PASSWORD: ${{ secrets.E2E_APP_PASSWORD }}
          PV_PROJECT_NAME: formation-gh-api
        run: mvn test

      - name: Generate test reports
        if: always()
        run: python3 scripts/generate_test_reports.py

      - name: Upload l'historique des exécutions
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-history
          path: e2e-tests/history/history.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Publier le résumé dans le Job Summary
        if: always()
        run: |
          if [ -f target/reporting/summary.md ]; then
            cat target/reporting/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ La génération du rapport a échoué, aucun résumé disponible." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports (sauvegarde)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e-tests/target/reporting/*.csv
            e2e-tests/target/reporting/*.xlsx
            e2e-tests/target/reporting/*.docx
            e2e-tests/target/reporting/*.pdf
            e2e-tests/target/screenshots/**

      - name: Upload du rapport HTML pour publication GitHub Pages
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pages-report
          path: e2e-tests/target/reporting
          retention-days: 1

  publish-history:
    needs: e2e-tests
    if: always() && needs.e2e-tests.result != 'cancelled' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Télécharger l'historique généré
        id: download-history
        continue-on-error: true
        uses: actions/download-artifact@v4.1.3
        with:
          name: e2e-history
          path: e2e-tests/history

      - name: Committer et publier l'historique
        if: steps.download-history.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain -- e2e-tests/history/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            cp e2e-tests/history/history.json /tmp/history.json
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              cp /tmp/history.json e2e-tests/history/history.json
              git add e2e-tests/history/history.json
              git commit -m "chore: mise à jour de l'historique des tests E2E [skip ci]"
              if git push; then
                exit 0
              fi
              echo "Tentative ${attempt} échouée, nouvelle tentative après un court délai..."
              sleep $((RANDOM % 5 + 1))
            done
            echo "⚠️ Impossible de publier l'historique après plusieurs tentatives." >&2
            exit 1
          else
            echo "Historique inchangé, rien à committer."
          fi

  deploy-report:
    needs: e2e-tests
    if: always() && needs.e2e-tests.result != 'cancelled' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Télécharger le rapport généré
        uses: actions/download-artifact@v4.1.3
        with:
          name: e2e-pages-report
          path: reporting

      - name: Vérifier la présence du rapport
        id: check-report
        run: |
          if [ -f reporting/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Le rapport HTML est introuvable, publication GitHub Pages annulée." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurer GitHub Pages
        if: steps.check-report.outputs.available == 'true'
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact Pages
        if: steps.check-report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reporting

      - name: Déployer le rapport sur GitHub Pages
        if: steps.check-report.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Lier le rapport publié dans le Job Summary
        if: steps.deployment.outputs.page_url
        run: |
          {
            echo ""
            echo "📄 **Rapport complet (PV de recette + captures d'écran) consultable directement sur GitHub Pages :** ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
