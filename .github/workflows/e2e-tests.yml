name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show browser version
        run: |
          (google-chrome --version || chromium --version || chromium-browser --version)

      - name: Run E2E tests
        run: mvn test

      - name: Generate test reports
        if: always()
        run: python3 scripts/generate_test_reports.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e-tests/target/reporting/*.csv
            e2e-tests/target/reporting/*.xlsx
            e2e-tests/target/reporting/*.pdf
            e2e-tests/target/screenshots/**
